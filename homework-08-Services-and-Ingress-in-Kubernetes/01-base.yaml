# ============================================================
# Базова конфігурація для домашки 08
# Namespace + Deployment (3 репліки nginx) + Service NodePort
#
# Це СТАРТОВА точка — на ній ми відштовхуємось.
# Service тут навмисно NodePort, бо в Кроці 1 ми будемо
# переводити його на ClusterIP.
# ============================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: homework-08
  labels:
    homework: "08"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  namespace: homework-08
  labels:
    app: nginx-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-app
  namespace: homework-08
  labels:
    app: nginx-app
spec:
  type: NodePort
  selector:
    app: nginx-app
  ports:
    - name: http
      port: 80           # порт самого Service (всередині кластера)
      targetPort: http   # посилання на name з containerPort
      nodePort: 30080    # порт на хост-машині (Docker Desktop = localhost:30080)
      protocol: TCP
