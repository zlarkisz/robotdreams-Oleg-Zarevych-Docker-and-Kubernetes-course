# ============================================================
# Крок 2 — Health Checks: livenessProbe + readinessProbe
#
# Що змінилось порівняно з 01-base.yaml:
#   - до контейнера nginx додано livenessProbe і readinessProbe
#   - обидві перевіряють HTTP GET / на порту http (80)
#
# Service не чіпаємо — він уже ClusterIP з Кроку 1.
# Namespace теж не чіпаємо.
# ============================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  namespace: homework-08
  labels:
    app: nginx-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # ----------------------------------------------------
          # LIVENESS — "процес живий чи завис?"
          # Якщо фейлить failureThreshold разів підряд:
          #   → kubelet ВБИВАЄ контейнер і запускає новий
          # ----------------------------------------------------
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10 # дай старту 10с спокою
            periodSeconds: 10 # пінгуй кожні 10с
            timeoutSeconds: 2 # відповідь має прийти за 2с
            failureThreshold: 3 # 3 фейли підряд = вмер
            successThreshold: 1 # для liveness завжди 1 (інше навіть заборонено)

          # ----------------------------------------------------
          # READINESS — "готовий приймати трафік?"
          # Якщо фейлить:
          #   → IP пода ПРИБИРАЄТЬСЯ зі списку Endpoints
          #   → Service більше не шле на нього запити
          #   → під продовжує жити, не рестартує
          # Як знову проходить — IP повертається.
          # ----------------------------------------------------
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3 # nginx стартує швидко
            periodSeconds: 5 # частіше за liveness — швидше реагує
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1 # 1 успіх після фейлу = знову готовий
