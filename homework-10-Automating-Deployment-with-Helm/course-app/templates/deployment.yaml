# =============================================================================
# Deployment: course-app  (шаблонізований з homework-09/deployment.yaml)
# Усі змінні значення — з .Values; імена/лейбли — з _helpers.tpl.
# =============================================================================
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "course-app.fullname" . }}
  labels:
    {{- include "course-app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}        # було replicas: 5 (хардкод)

  selector:
    matchLabels:
      {{- include "course-app.selectorLabels" . | nindent 6 }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        {{- include "course-app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "course-app.name" . }}

          # було: image: zlarkisz/course-app:1.0.1 (хардкод)
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.container.port }}   # було 8080 (хардкод)
              protocol: TCP

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # -------------------------------------------------------------------
          # env — КРОК 3: інтеграція з Bitnami Redis
          # -------------------------------------------------------------------
          env:
            - name: APP_STORE
              value: {{ .Values.app.store | quote }}

            # APP_REDIS_URL: тепер вказує на redis-master (Bitnami).
            # Змінили ЛИШЕ values.yaml — цей шаблон не чіпали логічно,
            # бо host/port і так були параметрами. У цьому сенс шаблонізації.
            - name: APP_REDIS_URL
              value: "redis://{{ .Values.app.redisHost }}:{{ .Values.app.redisPort }}"

            - name: APP_MESSAGE
              value: {{ .Values.app.message | quote }}

            {{- if .Values.app.redisAuth.enabled }}
            # КРОК 3: пароль Redis. Значення НЕ хардкодимо і НЕ пишемо в
            # маніфест — Kubernetes сам підставить його з Secret у рантаймі.
            # secretKeyRef = "візьми значення з Secret <name>, ключ <key>".
            # Так пароль не світиться ні в чарті, ні в `kubectl get deploy -o yaml`.
            - name: APP_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.redisAuth.secretName | quote }}
                  key: {{ .Values.app.redisAuth.secretKey | quote }}
            {{- end }}
