apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 10
  strategy:
    type: Recreate
    # rollingUpdate:
    #   maxSurge: 0
    #   maxUnavailable: 5
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          # 1) Підключаємо як env vars (НЕ оновлюється на льоту)
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: nginx-config
                  key: APP_VERSION
            - name: WELCOME_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: nginx-config
                  key: WELCOME_MESSAGE
          # 2) Підключаємо файл як volume (оновлюється автоматично)
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html-volume
          configMap:
            name: nginx-config
            items:
              - key: index.html
                path: index.html
