# =============================================================================
# Service: redis (Headless / ClusterIP: None)
# =============================================================================
# Призначення:
#   Дати застосунку course-app стабільну точку доступу до Redis ВСЕРЕДИНІ
#   кластера. course-app звертатиметься за адресою redis://redis:6379, де
#   "redis" — це DNS-ім'я цього Service.
#
# Чому саме HEADLESS Service (clusterIP: None), а не звичайний ClusterIP:
#
#   Звичайний ClusterIP:
#     - має власну віртуальну IP
#     - kube-proxy балансує трафік між подами
#     - клієнт не знає, на який під потрапив
#     - DNS-ім'я Service → віртуальна IP
#     → підходить для STATELESS (course-app, фронтенд)
#
#   Headless (clusterIP: None) — НАШ ВИБІР:
#     - НЕ має власної IP
#     - НЕ балансує
#     - DNS-ім'я Service → напряму IP подів
#     - кожен под StatefulSet отримує власне DNS-ім'я:
#         redis-0.redis.default.svc.cluster.local
#     → канонічний партнер StatefulSet (поле serviceName у StatefulSet
#       посилається саме на такий Service)
#
# Чому НЕ NodePort (як було у course-app):
#   До Redis звертається тільки course-app зсередини кластера. Браузером
#   у Redis ніхто не лізе → пробивати порт назовні не потрібно й небезпечно.
#
# Аналогія:
#   Звичайний ClusterIP = гаряча лінія кол-центру: один номер, відповідає
#     випадковий вільний оператор.
#   Headless service = внутрішній довідник з прямими номерами: можна
#     подзвонити саме "redis-0".
# =============================================================================

# -----------------------------------------------------------------------------
# apiVersion: v1
# -----------------------------------------------------------------------------
# Service живе в "core" API group (без префіксу) — разом з Pod, ConfigMap,
# Namespace. На відміну від StatefulSet/Deployment (apps/v1).
apiVersion: v1

# -----------------------------------------------------------------------------
# kind: Service
# -----------------------------------------------------------------------------
kind: Service

# =============================================================================
# metadata — паспорт Service
# =============================================================================
metadata:
  # ⚠️ Ім'я Service = DNS-ім'я в кластері.
  # Інші поди звертаються до Redis так:
  #   redis                                  (з того ж namespace)
  #   redis.default                          (з іншого namespace)
  #   redis.default.svc.cluster.local        (повний FQDN)
  #
  # ⚠️ Це ім'я МУСИТЬ збігатися з полем serviceName у redis-statefulset.yaml.
  # Саме через цей збіг StatefulSet "знає" свій headless service.
  #
  # ⚠️ Це ж ім'я course-app використовує в APP_REDIS_URL: redis://redis:6379
  name: redis
  labels:
    app: redis
    component: cache

# =============================================================================
# spec — як Service працює
# =============================================================================
spec:
  # ---------------------------------------------------------------------------
  # clusterIP: None — ЦЕ РОБИТЬ SERVICE "HEADLESS"
  # ---------------------------------------------------------------------------
  # Саме один цей рядок перетворює звичайний ClusterIP на headless:
  #   - Service не отримує власної віртуальної IP
  #   - kube-proxy не балансує трафік
  #   - DNS запит "redis" повертає IP самих подів напряму
  #   - кожен под StatefulSet отримує адресоване DNS-ім'я redis-<N>.redis
  #
  # type не вказуємо — за замовчуванням ClusterIP, а clusterIP: None
  # робить його headless-різновидом.
  clusterIP: None

  # ---------------------------------------------------------------------------
  # selector — які поди обслуговувати
  # ---------------------------------------------------------------------------
  # Service шле трафік на поди з лейблом app: redis.
  # ⚠️ Має збігатися з template.metadata.labels у redis-statefulset.yaml.
  # Саме так Service "знаходить" поди Redis.
  selector:
    app: redis

  # ---------------------------------------------------------------------------
  # ports — порт Redis
  # ---------------------------------------------------------------------------
  ports:
    - name: redis
      # port — порт, на якому Service приймає звернення (course-app → :6379)
      port: 6379
      # targetPort — порт у поді. 'redis' — це name з containerPort у
      # redis-statefulset.yaml. Іменована форма: якщо колись зміниться порт
      # контейнера, правити треба буде лише в одному місці (StatefulSet).
      targetPort: redis
      protocol: TCP
