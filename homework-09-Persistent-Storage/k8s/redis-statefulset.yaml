# =============================================================================
# StatefulSet: redis
# =============================================================================
# Що таке StatefulSet:
#   Workload-контролер K8s для застосунків, яким потрібна СТАЛА ІДЕНТИЧНІСТЬ:
#   стабільне ім'я пода, стабільний власний диск, впорядкований запуск.
#   На відміну від Deployment (для stateless застосунків — вебсервери, API).
#
# Чим StatefulSet відрізняється від Deployment:
#
#   ┌────────────────────┬─────────────────────┬──────────────────────────┐
#   │                    │ Deployment          │ StatefulSet              │
#   ├────────────────────┼─────────────────────┼──────────────────────────┤
#   │ Імена подів        │ випадкові           │ порядкові: redis-0,      │
#   │                    │ (app-7d9f-x9k2p)    │ redis-1, redis-2 ...     │
#   │ Після рестарту     │ нове випадкове ім'я │ ТЕ САМЕ ім'я             │
#   │ Диск               │ спільний / ефемерний│ свій PVC на кожен под    │
#   │                    │                     │ через volumeClaimTemplates│
#   │ Запуск реплік      │ всі паралельно      │ по черзі: 0 → 1 → 2      │
#   │ Зупинка реплік     │ всі паралельно      │ у зворотному порядку     │
#   │ Для чого           │ stateless (API,     │ stateful (БД, черги,     │
#   │                    │ фронтенд, воркери)  │ Redis, Kafka, etcd)      │
#   └────────────────────┴─────────────────────┴──────────────────────────┘
#
# Ієрархія: StatefulSet → Pod (redis-0) → Container (redis)
#           StatefulSet → PVC (redis-data-redis-0) → PV → папка на диску хоста
#
# Аналогія:
#   Deployment = бригада на зміну: працівники однакові, безіменні,
#                будь-кого можна замінити, нічого свого не зберігають.
#   StatefulSet = працівники з ІМЕННИМИ ШАФКАМИ: №0 завжди отримує той,
#                хто стоїть на позиції №0, і в шафці — його інструмент.
#                Захворів — заміна стає на позицію №0 і отримує ТУ САМУ шафку.
# =============================================================================

# -----------------------------------------------------------------------------
# apiVersion: apps/v1
# -----------------------------------------------------------------------------
# StatefulSet живе в API group 'apps' — там же, де Deployment, ReplicaSet,
# DaemonSet. 'v1' — стабільна версія. Для StatefulSet це практично константа.
apiVersion: apps/v1

# -----------------------------------------------------------------------------
# kind: StatefulSet
# -----------------------------------------------------------------------------
kind: StatefulSet

# =============================================================================
# metadata — паспорт об'єкта StatefulSet
# =============================================================================
metadata:
  # Ім'я StatefulSet. ⚠️ ВАЖЛИВО: це ім'я стає частиною імен подів і PVC!
  #   Поди:  redis-0, redis-1, ...        формат <statefulset-name>-<номер>
  #   PVC:   redis-data-redis-0, ...      формат <шаблон>-<statefulset-name>-<номер>
  # Тому ім'я має бути коротким і змістовним.
  name: redis
  labels:
    app: redis
    component: cache

# =============================================================================
# spec — бажаний стан StatefulSet
# =============================================================================
spec:
  # ---------------------------------------------------------------------------
  # serviceName — ОБОВ'ЯЗКОВЕ поле, унікальне для StatefulSet
  # ---------------------------------------------------------------------------
  # Посилання на ім'я HEADLESS Service (його створюємо в redis-service.yaml).
  # Headless service дає кожному поду стабільне DNS-ім'я у форматі:
  #   <pod-name>.<service-name>.<namespace>.svc.cluster.local
  #   тобто:  redis-0.redis.default.svc.cluster.local
  #
  # ⚠️ Service з такою назвою ще не існує на момент написання цього файлу —
  # це нормально. K8s дозволяє створювати об'єкти в будь-якому порядку,
  # вони "знаходять" одне одного через імена/лейбли вже після apply.
  serviceName: redis

  # ---------------------------------------------------------------------------
  # replicas — скільки подів Redis тримати
  # ---------------------------------------------------------------------------
  # 1 — нам потрібен один інстанс Redis для зберігання даних course-app.
  # Реальний відмовостійкий Redis-кластер мав би replicas: 3+ і налаштування
  # реплікації між redis-0 (master) і redis-1/2 (replicas) — але це поза
  # межами домашки. Тут мета — показати persistent storage, не HA.
  replicas: 1

  # ---------------------------------------------------------------------------
  # selector — як StatefulSet знаходить "свої" поди
  # ---------------------------------------------------------------------------
  # ⚠️ Мусить збігатися з template.metadata.labels (як і в Deployment).
  # selector — IMMUTABLE: після першого apply змінити не можна.
  selector:
    matchLabels:
      app: redis

  # ---------------------------------------------------------------------------
  # template — шаблон пода (як у Deployment)
  # ---------------------------------------------------------------------------
  template:
    metadata:
      labels:
        # Ці лейбли мусять включати все, що в selector.matchLabels вище.
        app: redis
        component: cache
    spec:
      containers:
        # =====================================================================
        # Контейнер: redis
        # =====================================================================
        - name: redis

          # -------------------------------------------------------------------
          # image: redis:7-alpine
          # -------------------------------------------------------------------
          # redis     — офіційний образ Redis з Docker Hub.
          # 7-alpine  — мажорна версія 7 на базі Alpine Linux (~30 MB проти
          #             ~110 MB у звичайного образу). Менший образ = швидший
          #             pull, менше місця, менша поверхня атаки.
          #
          # ВАЖЛИВО про /data: офіційний образ redis за замовчуванням робить
          # WORKDIR /data і періодично скидає снапшот бази у файл /data/dump.rdb
          # (механізм RDB-персистенції). Якщо змонтувати persistent volume саме
          # в /data — dump.rdb опиняється на постійному диску і переживає
          # рестарт/перестворення пода. У цьому весь сенс домашки.
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent

          # -------------------------------------------------------------------
          # ports — Redis слухає TCP 6379
          # -------------------------------------------------------------------
          # 6379 — стандартний порт Redis. Як і в Deployment, containerPort
          # нічого не "відкриває" — це документація + ціль для Service
          # (redis-service.yaml посилатиметься на цей порт).
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          # -------------------------------------------------------------------
          # resources — обмеження CPU/RAM
          # -------------------------------------------------------------------
          # Redis тримає дані в пам'яті, тож RAM-ліміт тут особливо змістовний:
          # якщо база виросте понад 128Mi — контейнер отримає OOMKilled.
          # Для домашки (кілька ключів від course-app) 128Mi — з величезним
          # запасом. requests — мінімум, гарантований scheduler'ом.
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"

          # -------------------------------------------------------------------
          # volumeMounts — куди В КОНТЕЙНЕРІ примонтувати том
          # -------------------------------------------------------------------
          # name      — посилання на volumeClaimTemplates[].metadata.name нижче.
          #             Саме через цей збіг імен под розуміє, який диск брати.
          # mountPath — /data, бо саме туди redis пише dump.rdb (див. коментар
          #             до image вище). Це і робить дані персистентними.
          volumeMounts:
            - name: redis-data
              mountPath: /data

  # ===========================================================================
  # volumeClaimTemplates — ШАБЛОН диска для кожного пода
  # ===========================================================================
  # Це головна "фішка" StatefulSet, якої немає в Deployment.
  #
  # Як це працює:
  #   1. StatefulSet бере цей шаблон як "креслення диска".
  #   2. Для КОЖНОЇ репліки створює ОКРЕМИЙ PVC за цим кресленням.
  #   3. Ім'я PVC = <metadata.name>-<statefulset-name>-<номер-репліки>
  #      тобто:  redis-data-redis-0
  #   4. Дефолтний StorageClass (hostpath) бачить новий PVC і автоматично
  #      створює під нього PV — фізичну папку на диску Mac (dynamic provisioning).
  #   5. PVC намертво прив'язується до пода redis-0. Под перестворюється —
  #      підхоплює ТОЙ САМИЙ PVC з тими самими даними.
  #
  # ⚠️ Життєвий цикл: PVC, створені звідси, НЕ видаляються разом зі StatefulSet.
  #    `kubectl delete statefulset redis` прибере под, але PVC (і дані!)
  #    залишаться — це навмисний захист від випадкової втрати даних.
  #    Прибирати PVC треба окремо: `kubectl delete pvc redis-data-redis-0`.
  #
  # Кожен елемент volumeClaimTemplates — це фактично вбудований PVC-маніфест
  # (без apiVersion/kind, бо тип і так відомий).
  volumeClaimTemplates:
    - metadata:
        # Назва шаблону. ⚠️ Мусить збігатися з volumeMounts[].name вище —
        # саме за цим ім'ям контейнер монтує цей том.
        # Завдання вимагає назву саме redis-data.
        name: redis-data
      spec:
        # -----------------------------------------------------------------
        # accessModes — як том можна монтувати
        # -----------------------------------------------------------------
        # ReadWriteOnce (RWO) — том монтується для читання+запису ТІЛЬКИ
        #   однією нодою одночасно. Правильний режим для БД: один власник
        #   диска, без конфліктів запису.
        # Альтернативи (нам не потрібні й часто не підтримуються hostpath):
        #   ReadOnlyMany  — багато нод, тільки читання
        #   ReadWriteMany — багато нод, читання+запис (потрібен NFS/CephFS тощо)
        accessModes:
          - ReadWriteOnce

        # -----------------------------------------------------------------
        # storageClassName — НАВМИСНО НЕ ВКАЗАНО
        # -----------------------------------------------------------------
        # Підказка із завдання: не вказувати storageClassName, щоб
        # підтягнувся дефолтний клас кластера.
        # У цьому кластері (Docker Desktop) дефолтний клас — hostpath.
        # Якби тут було вказано неіснуючий клас — PVC завис би в Pending.
        # storageClassName: ""   ← це означало б "взагалі без класу", НЕ те саме!
        #                          тому поле просто ВІДСУТНЄ.

        # -----------------------------------------------------------------
        # resources.requests.storage — скільки місця замовляємо
        # -----------------------------------------------------------------
        # 1Gi — за вимогою завдання. hostpath-провізор не робить реального
        # обмеження розміру (це просто папка на диску Mac), але поле
        # обов'язкове за специфікацією PVC і фігурує у `kubectl get pvc`.
        resources:
          requests:
            storage: 1Gi
